name: Build signed APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; else echo "VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}-ci" >> "$GITHUB_ENV"; fi
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Restore release keystore (dedicated key, never debug)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::SIGNING_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/sklejka-release.jks
          echo "SIGNING_STORE_FILE=keystore/sklejka-release.jks" >> "$GITHUB_ENV"

      - name: Unit tests (part detection, sorting, byte-exact streaming join)
        run: ./gradlew --stacktrace testReleaseUnitTest

      - name: Assemble signed release
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew --stacktrace assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/sklejka-fajlov-${VERSION_NAME}.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "dist/sklejka-fajlov-${VERSION_NAME}.apk" | tee dist/signature.txt

      - name: Check signing certificate
        run: |
          grep -i "SHA-256 digest: 9a473ae7747d4e0e994fbea3b163c7f571598c4fa190703116d396589cf8b077" dist/signature.txt \
            || { echo "::error::APK is not signed with the dedicated release key"; exit 1; }

      - name: Upload artifact (best effort)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sklejka-fajlov-apk
          path: dist/*.apk
          retention-days: 3

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="dist/sklejka-fajlov-${VERSION_NAME}.apk"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" --title "Склейка файлов ${VERSION_NAME}" --notes-file RELEASE_NOTES.md
          fi
